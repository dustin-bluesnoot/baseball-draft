// === HELPERS ===
function esc(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// === EVENT HANDLERS ===
function handleTeamCount(val) {
  const n = parseInt(val);
  const oldAssignments = { ...state.coachAssignments };
  initTeams(n);
  // Restore assignments that are still valid
  for (const [pid, tid] of Object.entries(oldAssignments)) {
    if (Number(tid) <= n) state.coachAssignments[pid] = tid;
  }
  render();
}

function handleTeamName(id, val) {
  getTeam(id).name = val;
  // Re-render the assignment dropdowns to reflect new names
  render();
}

function handleCoachName(id, val) {
  getTeam(id).coachName = val;
}

function handleAssign(playerId, teamId) {
  if (teamId) state.coachAssignments[playerId] = Number(teamId);
  else delete state.coachAssignments[playerId];
}

function dismissTransition() {
  state.showTransition = false;
  state.tiebreakerQueue = [];
  const next = getNextPickTeamId();
  if (next === null) {
    state.currentPickTeamId = null;
    render();
    showTiebreakerSpinner(getTiedTeamIds());
  } else {
    state.currentPickTeamId = next;
    render();
  }
}

// === LIVE SPECTATOR ===
const LIVE_KEY_PREFIX = "baseball_draft_live_";
let isSpectator = false;
let spectatorDraftId = null;

function generateDraftId() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function broadcastDraftState() {
  if (isSpectator || !state.liveDraftId) return;
  try {
    const payload = {
      state: JSON.parse(JSON.stringify(state)),
      players: JSON.parse(JSON.stringify(PLAYERS)),
      timestamp: Date.now(),
    };
    localStorage.setItem(LIVE_KEY_PREFIX + state.liveDraftId, JSON.stringify(payload));
  } catch (e) { console.warn("Failed to broadcast:", e); }
}

function startLiveDraft() {
  if (!state.liveDraftId) {
    state.liveDraftId = generateDraftId();
  }
  broadcastDraftState();
  const url = window.location.origin + window.location.pathname + "?spectate=" + state.liveDraftId;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert("Live link copied to clipboard!\n\n" + url + "\n\nShare this with coaches to watch the draft live.");
    });
  } else {
    prompt("Share this link with coaches:", url);
  }
}

function enterSpectatorMode(draftId) {
  isSpectator = true;
  spectatorDraftId = draftId;
  // Try to load current state
  const loaded = loadSpectatorState();
  // Listen for updates via storage events (cross-tab same profile)
  window.addEventListener("storage", onStorageUpdate);
  // Also poll periodically as fallback (handles same tab, InPrivate, etc.)
  setInterval(() => { loadSpectatorState(); }, 2000);
  // Always render even if no data yet (shows waiting screen)
  if (!loaded) render();
}

function loadSpectatorState() {
  try {
    const raw = localStorage.getItem(LIVE_KEY_PREFIX + spectatorDraftId);
    if (!raw) return false;
    const payload = JSON.parse(raw);
    if (!payload.state || !payload.players) return false;
    Object.assign(state, payload.state);
    PLAYERS = payload.players;
    nextPlayerId = PLAYERS.length > 0 ? Math.max(...PLAYERS.map(p => p.id)) + 1 : 1;
    render();
    return true;
  } catch (e) { return false; }
}

function onStorageUpdate(e) {
  if (!isSpectator || !spectatorDraftId) return;
  if (e.key === LIVE_KEY_PREFIX + spectatorDraftId) {
    loadSpectatorState();
  }
}

function renderSpectatorDraft(app) {
  const currentTeamId = state.currentPickTeamId;
  const currentTeam = currentTeamId ? getTeam(currentTeamId) : null;
  const available = getAvailablePlayers();
  const phaseLabel = state.phase === "year1" ? "Year 1 (2014)" : "Year 2 (2013)";
  const currentTeamScore = currentTeam ? calcTotalTeamScore(currentTeam) : 0;
  const yearFilter = state.phase === "year1" ? 1 : 2;

  let html = `
    <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:8px 16px;margin-bottom:12px;text-align:center;font-size:0.9em;">
      <strong>SPECTATOR MODE</strong> &mdash; Watching draft live (ID: ${esc(spectatorDraftId)})
    </div>
    <div class="on-the-clock">
      <div class="phase-badge">${phaseLabel} &mdash; Pick #${state.pickNumber + 1}</div>
      <div class="team-name">${currentTeam ? esc(currentTeam.name) : 'Waiting...'}</div>
      <div class="pick-info">${currentTeam ? `Team Score: ${currentTeamScore}` : 'Draft in progress'}</div>
    </div>
    <div class="draft-layout">
      <div class="available-panel card">
        <h2>Available Players</h2>
        <div class="available-scroll">
          <table class="player-table">
            <thead><tr><th>#</th><th>Player</th><th>Yr</th><th>DOB</th><th>P</th><th>Hit</th><th>Fld</th><th>2B</th><th>Total</th></tr></thead>
            <tbody>
              ${available.length === 0 ? '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:20px;">No players available</td></tr>' :
                (() => {
                  let rows = "";
                  let shownSeparator = false;
                  let currentIdx = 0;
                  available.forEach(p => {
                    const isOtherYear = p.year !== yearFilter;
                    if (isOtherYear && !shownSeparator) {
                      const otherYearLabel = state.phase === "year1" ? "Year 2 (2013)" : "Year 1 (2014)";
                      rows += '<tr class="year-separator"><td colspan="9">' + otherYearLabel + ' Players</td></tr>';
                      shownSeparator = true;
                      currentIdx = 0;
                    }
                    currentIdx++;
                    const cls = `${p.score === 0 ? 'zero-score' : ''} ${isOtherYear ? 'other-year' : ''}`;
                    rows += '<tr class="' + cls + '">' +
                      '<td>' + currentIdx + '</td>' +
                      '<td>' + esc(p.name) + (p.flag === 'A' ? ' <span class="asst-badge">AC</span>' : '') + '</td>' +
                      '<td>' + (p.year || "-") + '</td>' +
                      '<td>' + (p.dob || "N/A") + '</td>' +
                      '<td>' + (p.pitching || "-") + '</td>' +
                      '<td>' + (p.hitting || "-") + '</td>' +
                      '<td>' + (p.fielding || "-") + '</td>' +
                      '<td>' + (p.time2b || "-") + '</td>' +
                      '<td><strong>' + p.score + '</strong></td>' +
                    '</tr>';
                  });
                  return rows;
                })()}
            </tbody>
          </table>
        </div>
      </div>
      <div class="rosters-panel">
        ${[...state.draftOrder].sort((a, b) => calcTotalTeamScore(getTeam(a)) - calcTotalTeamScore(getTeam(b))).map(tid => {
          const t = getTeam(tid);
          const players = getAllTeamPlayers(t);
          const teamScore = calcTotalTeamScore(t);
          const isActive = tid === currentTeamId;
          return '<div class="roster-card ' + (isActive ? 'active' : '') + '">' +
            '<div class="team-header"><h3>' + esc(t.name) + (isActive ? ' &#9668;' : '') + '</h3></div>' +
            '<div class="draft-order-note">Total score: ' + teamScore + '</div>' +
            '<ul>' +
            t.preAssigned.filter(id => !getPlayer(id).isCoachOnly).map(id => {
              const p = getPlayer(id);
              const badge = p.flag === "C" ? '<span class="head-coach-badge">HC</span>' : '<span class="asst-badge">AC</span>';
              return '<li>' + esc(p.name) + ' ' + badge + ' <span class="score">' + p.score + '</span></li>';
            }).join("") +
            t.drafted.map(id => {
              const p = getPlayer(id);
              return '<li>' + esc(p.name) + (p.flag === 'A' ? ' <span class="asst-badge">AC</span>' : '') + ' <span class="score">' + p.score + '</span></li>';
            }).join("") +
            (players.length === 0 ? '<li style="color:#cbd5e1;">No players yet</li>' : '') +
            '</ul></div>';
        }).join("")}
      </div>
    </div>
    <div class="card" style="margin-top:4px;">
      <h3>Draft Log</h3>
      <div class="draft-log">
        ${state.history.slice().reverse().map(h => {
          if (h.type === "pre-assign") {
            const p = getPlayer(h.playerId);
            const t = getTeam(h.teamId);
            return '<div class="log-entry" style="color:#1e40af;"><span class="round-label">PRE:</span> ' + esc(t.name) + ' &larr; <strong>' + esc(p.name) + '</strong> (' + p.score + ')</div>';
          }
          if (h.type === "edit") {
            return '<div class="log-entry" style="color:#d97706;"><span class="round-label">EDIT:</span> <strong>' + esc(h.description) + '</strong></div>';
          }
          if (h.type === "trade") {
            const phLbl = h.phase === "year1" ? "Y1" : "Y2";
            return '<div class="log-entry" style="color:#7c3aed;"><span class="round-label">' + phLbl + ':</span> <strong>' + esc(h.description) + '</strong></div>';
          }
          const p = getPlayer(h.playerId);
          const t = getTeam(h.teamId);
          const phLbl = h.phase === "year1" ? "Y1" : "Y2";
          return '<div class="log-entry"><span class="round-label">' + phLbl + ' #' + h.pickNumber + ':</span> ' + esc(t.name) + ' drafted <strong>' + esc(p.name) + '</strong> (' + p.score + ')</div>';
        }).join("")}
        ${state.history.length === 0 ? '<div style="color:#94a3b8;padding:8px 0;">No picks yet</div>' : ''}
      </div>
    </div>
  `;
  app.innerHTML = html;
}

// === INIT ===
loadArchive();
const _urlParams = new URLSearchParams(window.location.search);
const _spectateId = _urlParams.get("spectate");
if (_spectateId) {
  enterSpectatorMode(_spectateId);
} else {
  render();
}
</script>
</body>
</html>
